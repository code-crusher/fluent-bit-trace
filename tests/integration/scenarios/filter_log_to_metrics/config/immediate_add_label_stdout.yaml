service:
  flush: 1
  grace: 1
  log_level: info
  http_server: on
  http_port: ${FLUENT_BIT_HTTP_MONITORING_PORT}

pipeline:
  inputs:
    # Two input instances feeding different label values through the same
    # filter: the log_to_metrics context is shared, so every append encodes
    # every series seen so far (issue #12107 topology).
    - name: dummy
      tag: device.node1
      samples: 10
      dummy: '{"block_device": "vda", "used_percent": "0.01"}'

    - name: dummy
      tag: device.node2
      samples: 10
      dummy: '{"block_device": "vdb", "used_percent": "0.01"}'

  filters:
    - name: log_to_metrics
      match: device.*
      tag: metrics.device
      metric_mode: gauge
      metric_name: used_percent
      metric_description: Device used percent
      metric_namespace: host
      value_field: used_percent
      add_label: block_device $block_device

  outputs:
    - name: stdout
      match: metrics.device
      format: template
      json_date_key: false
